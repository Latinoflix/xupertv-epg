
name: XuperTV EPG - Actualizacion automatica

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  actualizar-guia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Procesar guia XMLTV
        run: python build_epg.py

      - name: Publicar guia actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/epg.json
          git diff --cached --quiet || git commit -m "Actualizar guia EPG"
          git push
